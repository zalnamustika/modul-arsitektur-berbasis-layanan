input {
  beats {
    port => 5044
  }
}

filter {
  if [docker][container][labels][com_docker_compose_service] {
    mutate { add_field => { "service_name" => "%{[docker][container][labels][com_docker_compose_service]}" } }
  } else if [docker][container][labels][com.docker.compose.service] {
    mutate { add_field => { "service_name" => "%{[docker][container][labels][com.docker.compose.service]}" } }
  } else if [container][name] {
    mutate { add_field => { "service_name" => "%{[container][name]}" } }
  } else if [message] =~ "EurekaServiceApplication|eureka-service|Eureka Server" {
    mutate { add_field => { "service_name" => "eureka-server" } }
  } else if [message] =~ "auth-service" {
    mutate { add_field => { "service_name" => "auth-service" } }
  } else if [message] =~ "order-service" {
    mutate { add_field => { "service_name" => "order-service" } }
  } else if [message] =~ "product-service" {
    mutate { add_field => { "service_name" => "product-service" } }
  } else if [message] =~ "email-service" {
    mutate { add_field => { "service_name" => "email-service" } }
  } else {
    mutate { add_field => { "service_name" => "other-service" } }
  }

  mutate {
    lowercase => ["service_name"]
    gsub => ["service_name", "^/", ""]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{service_name}-logs-%{+YYYY.MM.dd}"
  }
}
